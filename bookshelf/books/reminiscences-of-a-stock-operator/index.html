<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>股票作手回忆录宫殿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;700&display=swap">
<style>
/* 布局：全屏三维场景 + 四角浮层。七个街区对应利文斯顿的七段人生，每站一件物件和一块K线屏；浮层刻意采用单一的暗色玻璃风格 */
:root{
  color-scheme:dark;
  --glass:rgba(14,18,24,.86); --glass-2:rgba(255,255,255,.08);
  --ink:#EEF0EA; --ink-soft:#AAB4BC; --line:rgba(255,255,255,.16);
  --accent:#E3B45A; --up:#E0473F; --down:#1FA37A; --blue:#8FB3DC;
  --display:"ZCOOL XiaoWei","STKaiti","KaiTi",serif;
  --body:"Noto Serif SC","Songti SC","SimSun",serif;
}
[hidden]{display:none!important}
.fx{font-family:var(--body);font-weight:400}
.brand h1 .fx{font-size:inherit;color:inherit;letter-spacing:inherit}
html,body{height:100%}
body{margin:0;background:#141a22;color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#c:active{cursor:grabbing}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--display);font-weight:400;margin:0}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

#top{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.brand{padding:8px 14px;display:flex;flex-direction:column;line-height:1.2}
.brand h1{font-size:20px;letter-spacing:.04em}
.brand span{font-size:11px;color:var(--ink-soft);letter-spacing:.1em}
#chips{display:flex;gap:3px;padding:5px;overflow-x:auto;min-width:0;flex:1 1 420px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:transparent;border-radius:6px;padding:4px 9px;white-space:nowrap;color:var(--ink-soft);display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.chip b{font-family:var(--display);font-weight:400;font-size:15px}
.chip small{font-size:10px;opacity:.8}
.chip:hover{background:var(--glass-2);color:var(--ink)}
.chip.on{background:var(--accent);color:#1b1f26}
.tools{display:flex;flex-wrap:wrap;gap:6px;padding:5px}
.seg{display:inline-flex;border-radius:6px;background:var(--glass-2);padding:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:5px;font-size:13px;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#141b24}
.tbtn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:4px 10px;font-size:13px}
.tbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

#where{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 124px);font-family:var(--display);font-size:15px;letter-spacing:.16em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none;white-space:nowrap}

#panel{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(460px,calc(100vw - 24px));max-height:62vh;overflow:auto;padding:16px 18px 14px}
.eb{font-size:11.5px;letter-spacing:.12em;color:var(--accent)}
.ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:3px 0 8px}
.ph h2{font-size:24px;line-height:1.2}
.ph small{font-size:12.5px;color:var(--ink-soft)}
.chartbox{position:relative;margin:4px 0 6px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:8px 8px 6px}
.chartbox .ct{font-size:12px;color:var(--ink-soft);margin:0 2px 4px}
.chartbox canvas{display:block;width:100%;height:210px;touch-action:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink-soft);margin:4px 2px 0}
.legend i{font-style:normal;display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px;border-radius:2px}
.lg-b{background:var(--accent)}
.lg-d{border:1.5px solid var(--accent);transform:rotate(45deg);width:7px!important;height:7px!important;border-radius:0!important}
.lg-s{border:1.5px dashed var(--ink-soft)}
.tip{position:absolute;pointer-events:none;background:#0B0F14;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;line-height:1.55;max-width:230px;z-index:2;font-variant-numeric:tabular-nums}
.tip b{color:var(--accent);font-weight:700}
.img{font-size:14.5px;line-height:1.85;margin:6px 0 10px}
.key{display:flex;gap:8px;align-items:baseline;margin:0;line-height:1.7}
.key i{font-style:normal;font-size:11px;letter-spacing:.12em;background:var(--accent);color:#1b2028;padding:0 6px;border-radius:2px;flex:none}
.key b{font-weight:700}
.more{font-size:12.5px;color:var(--ink-soft);margin:8px 0 0;line-height:1.8}
.quote{margin:10px 0 0;padding:6px 10px;border-left:2px solid var(--accent);font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:13px;color:#E8E2CC}
.quote span{display:block;font-style:normal;font-family:var(--body);font-size:11px;color:var(--ink-soft);margin-top:2px}
.bridge{color:var(--accent)!important}
.q{font-family:var(--display);font-size:18px;color:var(--blue);margin:4px 0 8px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 12px;font-size:13px}
.acts .ok{border-color:var(--down);color:var(--down)}
.acts .no{border-color:var(--up);color:var(--up)}
.acts .sel{background:var(--ink);color:#141b24;border-color:var(--ink)}
.pnav{display:flex;gap:6px;margin-top:12px;border-top:1px solid var(--line);padding-top:10px;align-items:center}
.pnav button{border:1px solid var(--line);background:var(--glass-2);border-radius:6px;padding:5px 12px;font-size:13px}
.pnav .sp{flex:1}
.pnav .prog{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

#pad{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px;padding:8px}
#pad button{border:1px solid var(--line);background:var(--glass-2);border-radius:8px;font-size:13px;user-select:none;-webkit-user-select:none;touch-action:none}
#pad button.hold{background:var(--accent);color:#1b2028}
.keys{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 148px);padding:8px 12px;font-size:11.5px;color:var(--ink-soft);line-height:1.85}
.keys b{color:var(--ink);font-weight:700;font-family:ui-monospace,Menlo,monospace;font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 4px}

#intro{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,12,18,.55);padding:16px;z-index:5}
#intro .card{max-width:560px;padding:24px 26px 22px;max-height:88vh;overflow:auto}
#intro h2{font-size:30px;margin-bottom:8px}
#intro p{color:var(--ink-soft);line-height:1.8;margin:0 0 10px}
#intro ol{margin:0 0 14px;padding-left:1.4em;line-height:1.85;font-size:13.5px}
#intro ol b{color:var(--accent);font-weight:400;font-family:var(--display);font-size:15.5px}
#intro ol span{color:var(--ink-soft)}
#go{border:0;background:var(--accent);color:#1b1f26;border-radius:8px;padding:9px 22px;font-size:15px}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--ink-soft);z-index:6;background:#141a22}

@media (max-width:700px){
  .keys{display:none}
  #where{top:calc(env(safe-area-inset-top,0px) + 160px)}
  #panel{max-height:44vh;bottom:calc(env(safe-area-inset-bottom,0px) + 140px)}
  .brand h1{font-size:17px}
  .chartbox canvas{height:180px}
}
@media (hover:hover) and (pointer:fine) and (min-width:701px){#pad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px)}}
</style>
</head>
<body>

<canvas id="c" aria-label="股票作手回忆录三维宫殿"></canvas>
<div id="loading">正在搭建宫殿…</div>

<div id="top">
  <div class="brand glass"><h1>股票作手<span class="fx">回</span>忆录 · 记忆宫殿</h1><span>七个街区 · 三十五站 · 书中价位K线</span></div>
  <div id="chips" class="glass" role="navigation" aria-label="街区"></div>
  <div class="tools glass">
    <a class="tbtn" href="../../" style="text-decoration:none">← 书架</a>
    <div class="seg" role="group" aria-label="视角"><button id="v-crane" aria-pressed="true">纸鹤</button><button id="v-eye" aria-pressed="false">第一人称</button></div>
    <div class="seg" role="group" aria-label="模式"><button id="m-tour" aria-pressed="true">游览</button><button id="m-recall" aria-pressed="false">回忆</button></div>
    <button class="tbtn" id="auto" aria-pressed="false">自动巡游</button>
  </div>
</div>
<div id="where"></div>
<div id="panel" class="glass" aria-live="polite"></div>
<div class="keys glass">
  <div><b>W</b><b>S</b> 前进后退　<b>A</b><b>D</b> 转向</div>
  <div><b>空格</b> 上升　<b>Shift</b> 下降　拖动鼠标 看四周</div>
  <div><b>N</b> 下一站　<b>B</b> 上一站　点击发光编号 飞过去</div>
</div>
<div id="pad" class="glass">
  <button data-k="up">上升</button><button data-k="fwd">前进</button><button data-k="down">下降</button>
  <button data-k="left">左转</button><button data-k="back">后退</button><button data-k="right">右转</button>
</div>

<div id="intro" hidden>
  <div class="card glass">
    <h2>拉里·利文斯顿的一生</h2>
    <p>这座宫殿按《股票作手回忆录》（1923）的顺序建成：七个街区对应他人生的七段，从14岁的报价板男孩一路走到操纵大师。每个街区五站，每站有一件只属于那段故事的物件，身后立着一块K线屏。</p>
    <ol id="introList"></ol>
    <p>K线里凡是书中写明的价位都用实心和金色标记；书里没写的部分按叙述补全，画成虚线空心，并注明是示意。飞近发光编号就能看到那一站；按 N 自动飞往下一站。</p>
    <button id="go">起飞</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

   标记: [K线序号, 价位, 'B'买入/回补 | 'S'卖出/做空 | 'N'事件, 说明]

*/

const MT={};function markerTex(n,st){const k=n+st;if(!MT[k])MT[k]=TX(128,128,(g,w,h)=>{g.beginPath();g.arc(w/2,h/2,w/2-8,0,7);g.fillStyle=st==='on'?'#E0674E':st==='ok'?'#3C8A6C':'rgba(252,246,230,.95)';g.fill();g.lineWidth=7;g.strokeStyle=st==='on'?'#fff':'#D4AF37';g.stroke();g.fillStyle=st==='idle'?'#22262c':'#fff';g.font=`bold 64px ${FB}`;g.textAlign='center';g.textBaseline='middle';g.fillText(n,w/2,h/2+4)});return MT[k]}
function strip(a,b,col){const dx=b.x-a.x,dz=b.z-a.z,L=Math.hypot(dx,dz);const m=add(scene,new THREE.PlaneGeometry(2.2,L),mt(col),(a.x+b.x)/2,0.05,(a.z+b.z)/2);m.rotation.order='YXZ';m.rotation.set(-Math.PI/2,Math.atan2(dx,dz),0);return m}
function boardTex(s){return TX(640,400,(c,w,h)=>{

  else{c.fillStyle='#101814';c.fillRect(0,0,w,h);T(c,s.t,w/2,120,40,'#F4E6C0',FD);T(c,'“'+s.q+'”',w/2,220,22,'#C9D2CC','Georgia,serif')}
  c.strokeStyle='#C9A04A';c.lineWidth=6;c.strokeRect(3,3,w-6,h-6)})}
function buildWorld(){

    Lab(scene,CN[i]+' · '+d.name,0,14,z0+20,1.5,'#FFFFFF');Lab(scene,d.yr+' · '+d.ch,0,12.5,z0+20,0.75,'#F4E6C0',FB);
    const side=i%2?1:-1;const bg=Grp(scene,side*32,0,z0-20);bg.rotation.y=side<0?Math.PI/2:-Math.PI/2;BUILD[i](bg);
    OFF.forEach(([ox,oz],k)=>{

      const g=Grp(scene,p.x,0,p.z);Cy(g,2.9,3.1,0.45,d.path,0,0.22,0,32);
      const s=d.S[k];PROPS[i][k](g);
      const bd=Grp(g,0,0,-3.7);[-2.5,2.5].forEach(x=>B(bd,0.16,6.6,0.16,'#2A2420',x,3.3,0));B(bd,5.3,3.35,0.12,'#2A2420',0,6.4,-0.05);
      Pl(bd,5.0,3.1,boardTex(s),0,6.4,0.02,true);
      const loc={d:i,k,v:new THREE.Vector3(p.x,4.4,p.z+10.5),yaw:0,pitch:0.02,idx:LOCS.length,state:''};
      const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:markerTex(k+1,'idle'),transparent:true,depthWrite:false}));sp.position.set(p.x,8.7,p.z-3.7);sp.scale.set(0.85,0.85,1);sp.userData.loc=loc;scene.add(sp);

}

/* =================== 纸鹤 =================== */
const crane=new THREE.Group();crane.rotation.order='YXZ';scene.add(crane);

/* =================== 状态与界面 =================== */
let prog={};try{prog=JSON.parse(localStorage.getItem('rso-prog')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('rso-prog',JSON.stringify(prog))}catch(e){}};
let view='crane',mode='tour',rev={},activeIdx=-1,shownKey='',autoOn=false,autoT=0;
const P=new THREE.Vector3(0,8,34);let yaw=0,pitch=-0.12;const keys={};let tween=null;
const idOf=L=>D[L.d].id+L.k;const TOTAL=D.length*5;
const chips=$('#chips');
D.forEach((d,i)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=`<b>${d.name}</b><small>${d.yr}</small>`;b.onclick=()=>{flyTo(LOCS[i*5]);b.blur()};chips.appendChild(b)});
$('#introList').innerHTML=D.map(d=>`<li><b>${d.name}</b>　<span>${d.yr} · ${d.sub} · ${d.ch}</span></li>`).join('');
function setSeg(a,b,on){$(a).setAttribute('aria-pressed',on);$(b).setAttribute('aria-pressed',!on)}
$('#v-crane').onclick=()=>{view='crane';setSeg('#v-crane','#v-eye',true);crane.visible=true};
$('#v-eye').onclick=()=>{view='eye';setSeg('#v-crane','#v-eye',false);crane.visible=false};
function refreshNames(){LOCS.forEach(L=>{L.name.visible=mode==='tour'||!!rev[idOf(L)]})}
function setMode(m){mode=m;rev={};setSeg('#m-tour','#m-recall',m==='tour');shownKey='';refreshNames()}
$('#m-tour').onclick=()=>setMode('tour');$('#m-recall').onclick=()=>setMode('recall');
$('#auto').onclick=()=>{autoOn=!autoOn;$('#auto').setAttribute('aria-pressed',autoOn);autoT=0;if(autoOn&&activeIdx<0)flyTo(LOCS[0])};

function distAt(z){if(z>Z0+16)return -1;return Math.max(0,Math.min(D.length-1,Math.floor((Z0+12-z)/DZ)))}
function nextLoc(dd){let base=activeIdx;if(base<0){const di=distAt(P.z);base=di<0?-1:di*5-1}flyTo(LOCS[Math.max(0,Math.min(LOCS.length-1,base+dd))])}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function mountChart(el,spec){
  const cv=el.querySelector('canvas'),tip=el.querySelector('.tip');
  const draw=()=>{const r=cv.getBoundingClientRect();const dpr=Math.min(devicePixelRatio,2);cv.width=Math.max(10,r.width*dpr);cv.height=Math.max(10,r.height*dpr);const c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);cv._res=drawChart(c,cv.width,cv.height,spec,{scale:dpr})};
  requestAnimationFrame(draw);
  const show=e=>{const res=cv._res;if(!res)return;const r=cv.getBoundingClientRect();const x=e.clientX-r.left;let best=null;res.slots.forEach(s=>{if(Math.abs(s.x-x)<s.w/2)best=s});
    if(!best){tip.hidden=true;return}const row=spec.c[best.i];let h='';
    if(spec.type==='bar'){h=`<b>${esc(row[0])}</b><br>${fmtV(row[1],spec)}${row[3]?'<br>'+esc(row[3]):''}<br><span style="color:var(--ink-soft)">书中数字</span>`}
    else{const [t,o,hh,l,c,b,n]=row;const src=k=>b&&b.includes(k)?' ◆书中':b&&b.includes(k.toUpperCase())?' ◇推算':'';
      h=`<b>${esc(t||'第'+(best.i+1)+'根')}</b><br>开 ${fmtV(o,spec)}${src('o')}　收 ${fmtV(c,spec)}${src('c')}<br>高 ${fmtV(hh,spec)}${src('h')}　低 ${fmtV(l,spec)}${src('l')}${n?'<br>'+esc(n):''}${!b?'<br><span style="color:var(--ink-soft)">示意值，书中未给</span>':''}`}
    tip.innerHTML=h;tip.hidden=false;const tw=tip.offsetWidth;tip.style.left=Math.max(4,Math.min(r.width-tw-4,best.x-tw/2))+'px';tip.style.top='34px'};
  cv.addEventListener('pointermove',show);cv.addEventListener('pointerdown',show);cv.addEventListener('pointerleave',()=>tip.hidden=true);
}
function renderPanel(){
  const pn=$('#panel'),done=Object.values(prog).filter(v=>v===1).length;
  const nav=`<div class="pnav"><button data-nav="-1">‹ 上一站</button><button data-nav="1">下一站 ›</button><span class="sp"></span><span class="prog">已记住 ${done}/${TOTAL}</span></div>`;
  let key;

    if(di<0)pn.innerHTML=`<div class="eb">起点</div><div class="ph"><h2>拉里·利文斯顿的七段人生</h2></div><p class="img">沿小路向北飞。七个街区按书中顺序排开，每区五站，每站一件物件和一块K线屏。</p><p class="more">原型是杰西·利弗莫尔，书由埃德温·勒菲弗撰写，1923年出版。按 N 直接飞到第一站。</p>${nav}`;
    else{const d=D[di];pn.innerHTML=`<div class="eb">第${CN[di]}区 · ${d.sub} · ${d.ch}</div><div class="ph"><h2>${d.name}</h2><small>${d.yr}</small></div><p class="more">本区五站：${d.S.map((s,k)=>(k+1)+' '+(mode==='recall'?'？':s.t)).join('　')}</p>${nav}`}}
  else{const L=LOCS[activeIdx],d=D[L.d],s=d.S[L.k],id=idOf(L),hidden=mode==='recall'&&!rev[id],st=prog[id];
    key=id+mode+(rev[id]?'r':'')+st;if(key===shownKey)return;shownKey=key;
    const ch=s.chart;
    const chartHTML=ch?`<div class="chartbox"><div class="ct">${esc(ch.title)}${ch.rel?' · 纵轴为相对变化':''}</div><canvas></canvas><div class="tip" hidden></div>
      <div class="legend">${ch.type==='bar'?'<span><i class="lg-b"></i>书中给出的数字</span>':'<span><i class="lg-b"></i>实心：含书中价位</span><span><i class="lg-d"></i>◆书中原文 ◇由书中数字推算</span><span><i class="lg-s"></i>虚线：按叙述补全</span><span>红涨绿跌</span>'}</div></div>`:'';
    pn.innerHTML=`<div class="eb">第${CN[L.d]}区 · ${d.name} · 第 ${L.k+1} 站 · 第${s.ch}章</div>

      :`<div class="ph"><h2>${s.t}</h2><small>${s.y}</small></div>${chartHTML}<p class="img">${s.img}</p><p class="key"><i>记住</i><b>${s.key}</b></p><p class="more">${s.more}</p>
      <p class="quote">${esc(s.q)}<span>原文 · 第${s.ch}章</span></p>
      ${L.k===4?`<p class="more bridge">${d.bridge}</p>`:''}
      ${mode==='recall'?`<div class="acts"><button class="ok ${st===1?'sel':''}" data-mark="1">我记得</button><button class="no ${st===0?'sel':''}" data-mark="0">没想起来</button></div>`:''}`}${nav}`;

  }
  pn.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{nextLoc(+b.dataset.nav);b.blur()});

  pn.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>{const L=LOCS[activeIdx];prog[idOf(L)]=+b.dataset.mark;save();refreshMarkers();shownKey='';b.blur();if(+b.dataset.mark===1)setTimeout(()=>nextLoc(1),350)});
}
function refreshMarkers(){LOCS.forEach(L=>{const st=L.idx===activeIdx?'on':prog[idOf(L)]===1?'ok':'idle';if(L.state!==st){L.state=st;L.sprite.material.map=markerTex(L.k+1,st);L.sprite.material.needsUpdate=true}})}

/* =================== 飞行 =================== */
function fwdVec(){return new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch))}
function flyTo(L){const off=innerWidth>900?0.34:0;const dy=((L.yaw+off-yaw+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
  tween={t:0,dur:RM?0.01:Math.min(2.6,0.8+P.distanceTo(L.v)/22),p0:P.clone(),p1:L.v.clone(),y0:yaw,y1:yaw+dy,pi0:pitch,pi1:L.pitch,loc:L};$('#intro').hidden=true}
const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const KM={KeyW:'fwd',ArrowUp:'fwd',KeyS:'back',ArrowDown:'back',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',Space:'up',KeyE:'up',ShiftLeft:'down',ShiftRight:'down',KeyQ:'down'};
addEventListener('keydown',e=>{if(KM[e.code]){keys[KM[e.code]]=true;if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();tween=null}if(e.code==='KeyN')nextLoc(1);if(e.code==='KeyB')nextLoc(-1)});
addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
$('#pad').querySelectorAll('button').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('hold');tween=null;try{b.setPointerCapture(e.pointerId)}catch(_){}};const off=()=>{keys[k]=false;b.classList.remove('hold')};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off)});
let drag=null;const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:0,id:e.pointerId};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);yaw-=dx*0.0042;pitch=Math.max(-1.3,Math.min(1.3,pitch-dy*0.0042));drag.x=e.clientX;drag.y=e.clientY;if(drag.moved>4)tween=null});
canvas.addEventListener('pointerup',e=>{if(drag&&drag.moved<6){const r=canvas.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,camera);const hit=ray.intersectObjects(markers)[0];if(hit)flyTo(hit.object.userData.loc)}drag=null});
canvas.addEventListener('wheel',e=>{e.preventDefault();tween=null;P.addScaledVector(fwdVec(),-e.deltaY*0.02)},{passive:false});

function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();shownKey=''}
addEventListener('resize',resize);
const skyC=D.map(d=>new THREE.Color(d.sky)),tmpC=new THREE.Color();
const clock=new THREE.Clock();let tAll=0;
function frame(){
  const dt=Math.min(clock.getDelta(),0.05);tAll+=dt;let moving=false;
  if(tween){tween.t+=dt/tween.dur;const k=ease(Math.min(1,tween.t));P.lerpVectors(tween.p0,tween.p1,k);P.y+=Math.sin(k*Math.PI)*Math.min(7,tween.p0.distanceTo(tween.p1)*0.08);
    yaw=tween.y0+(tween.y1-tween.y0)*k;pitch=tween.pi0+(tween.pi1-tween.pi0)*k;moving=true;if(tween.t>=1){tween=null;autoT=0}}
  else{if(keys.left)yaw+=1.7*dt;if(keys.right)yaw-=1.7*dt;if(keys.fwd)P.addScaledVector(fwdVec(),12*dt);if(keys.back)P.addScaledVector(fwdVec(),-8*dt);if(keys.up)P.y+=7*dt;if(keys.down)P.y-=7*dt;
    moving=!!(keys.fwd||keys.back||keys.up||keys.down||keys.left||keys.right);
    if(autoOn&&!moving){autoT+=dt;if(autoT>(mode==='recall'?12:10)){autoT=0;if(activeIdx>=LOCS.length-1){autoOn=false;$('#auto').setAttribute('aria-pressed',false)}else nextLoc(1)}}}
  P.y=Math.max(1.2,Math.min(90,P.y));
  let best=-1,bd=5.5;if(!tween)LOCS.forEach(L=>{const d=P.distanceTo(L.v);if(d<bd){bd=d;best=L.idx}});else if(tween.t>0.85)best=tween.loc.idx;
  if(best!==activeIdx){activeIdx=best;refreshMarkers();shownKey=''}
  renderPanel();
  const di=distAt(P.z);chips.querySelectorAll('.chip').forEach((c,i)=>c.classList.toggle('on',i===di));
  $('#where').textContent=di<0?'起点':'第'+CN[di]+'区 · '+D[di].name;
  const f=Math.max(0,Math.min(D.length-1,(Z0+12-P.z)/DZ-0.3)),a=Math.floor(f),b=Math.min(D.length-1,a+1);tmpC.copy(skyC[a]).lerp(skyC[b],f-a);scene.background.copy(tmpC);scene.fog.color.copy(tmpC);
  if(!RM){AN.forEach(fn=>fn(tAll));markers.forEach(s=>{const on=s.userData.loc.idx===activeIdx;s.scale.setScalar((on?0.95:0.78)+Math.sin(tAll*3+s.userData.loc.idx)*0.05)})}
  crane.position.copy(P);crane.rotation.set(pitch*0.6,yaw,0);const fl=Math.sin(tAll*(moving?9:3))*(moving?0.55:0.2);crane.userData.w[0].rotation.z=-fl;crane.userData.w[1].rotation.z=fl;crane.position.y+=Math.sin(tAll*2)*0.06;
  const fv=fwdVec();if(view==='crane'){const cp=P.clone().addScaledVector(fv,-4.4);cp.y+=1.9;camera.position.copy(cp);const lk=P.clone().addScaledVector(fv,6);lk.y+=0.9;camera.lookAt(lk)}else{camera.position.copy(P);camera.rotation.set(pitch,yaw,0)}
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
const fontReady=Promise.race([Promise.all([document.fonts.load('72px "ZCOOL XiaoWei"','对赌行少年华尔街的学费预感与恐慌商品与宿敌低谷与归来贴士与信号操纵的艺术'),document.fonts.load('40px "Noto Serif SC"','做空糖业书中价位')]).catch(()=>{}),new Promise(r=>setTimeout(r,2500))]);
fontReady.then(()=>{buildWorld();resize();refreshMarkers();if(RM)AN.forEach(fn=>fn(1.3));$('#loading').hidden=true;$('#intro').hidden=false;$('#go').onclick=()=>{$('#intro').hidden=true};requestAnimationFrame(frame)});
</script>
